databases:
  - name: credit-intel-db
    databaseName: credit_intel
    user: credit_intel

services:
  - type: web
    name: credit-intel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credit-intel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: static_site
    name: credit-intel-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: credit-intel-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html